[bar]
order = [ "widgets" ]

    [bar.widgets]
    capsule_group = []
    center = [ "date", "clock" ]
    end = [ "tray", "notifications", "volume", "bluetooth", "network", "battery", "session" ]
    margin_edge = 0
    margin_ends = 0
    radius = 50
    start = [ "control-center", "taskbar", "media" ]

[battery]
warning_threshold = 20

[brightness]
enable_ddcutil = true

[[control_center.shortcuts]]
type = "wifi"

[[control_center.shortcuts]]
type = "bluetooth"

[[control_center.shortcuts]]
type = "caffeine"

[[control_center.shortcuts]]
type = "notification"

[[control_center.shortcuts]]
type = "power_profile"

[[control_center.shortcuts]]
type = "wallpaper"

[dock]
active_monitor_only = true
auto_hide = true
background_opacity = 0.89999997988343239
compositor_blur = false
enabled = true
launcher_position = "start"
reserve_space = false

[idle.behavior.lock]
action = "lock"
enabled = true
timeout = 1200

[idle.behavior.screen-off]
action = "screen_off"
enabled = true
timeout = 1320

[idle.behavior.suspend]
action = "lock_and_suspend"
enabled = true
timeout = 1800

[lockscreen]
enabled = true

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@eDP-1", "lockscreen-login-box@HDMI-A-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 960.0
    cy = 898.0
    output = "HDMI-A-1"
    placement_height = 1080.0
    placement_width = 1920.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1".settings]
        background_color = "surface_container"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_password_reveal = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 960.0
    cy = 898.0
    output = "eDP-1"
    placement_height = 1080.0
    placement_width = 1920.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_container"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_password_reveal = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[nightlight]
enabled = true

[plugin_settings."dotnetrob/cat"]
panel_position = "center"

[plugins]
enabled = [ "gmkonan/protonvpn", "tordex/xwayland" ]

[shell]
avatar_path = "/home/piioni/.config/noctalia/assets/pfps/ryo-pfp.jpg"
lang = "es"

    [shell.launcher]
    width = 710

    [shell.panel]
    control_center_placement = "attached"
    open_near_click_control_center = true

    [shell.screen_corners]
    enabled = true

    [shell.screenshot]
    confirm_region = true
    show_cursor = true

    [shell.session.power]
    suspend = "systemctl suspend-then-hibernate"

[system.monitor]
cpu_poll_seconds = 10
gpu_poll_seconds = 10
memory_poll_seconds = 5
network_poll_seconds = 8

[theme]
builtin = "Catppuccin"
shell_mode = "follow"

    [theme.templates]
    builtin_ids = [ "btop" ]

[wallpaper]
directory = "/home/piioni/Pictures/walls"

    [wallpaper.default]
    path = "/home/piioni/Pictures/walls/samurai-no-face.jpg"

    [wallpaper.last]
    path = "/home/piioni/Pictures/walls/samurai-no-face.jpg"

[widget.battery]
hide_when_full = true
hide_when_plugged = true
show_label = true

[widget.network]
show_label = false

[widget.protonvpn]
type = "gmkonan/protonvpn:bar"

[widget.taskbar]
group_by_workspace = true
workspace_group_content = "icons"
group_single_icon_per_app = true
show_workspace_label = false
workspace_label_placement = "inside"
workspace_group_active_border_color = "#7aa2f7"
workspace_group_inactive_border_color = "#565f89"
hide_empty_workspaces = true
inactive_opacity = 0.7
show_active_indicator = true
